<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Infinia</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Anek+Latin:wght@400;500;600;700&family=EB+Garamond:ital@0;1&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="card">
    <div class="narrow">
      <div class="logo-placeholder">
        <img
          src="/logo.png"
          alt="Infinia"
          onerror="this.style.display='none'; this.nextElementSibling.style.display='block';"
          onload="this.nextElementSibling.style.display='none'; this.parentElement.classList.add('has-logo');"
        />
        <span style="display: none">LOGO</span>
      </div>
      <h1>¡Bienvenido a Infinia!</h1>
      <p class="hint">Ingresa tu DNI para comenzar</p>

      <div class="dni-row">
        <label class="dni-label">
          Documento
          <input type="text" id="documento" autocomplete="off" autofocus />
        </label>
        <button type="button" id="btn-buscar">Buscar</button>
        <button type="button" id="btn-registrarme" class="secondary">Registrarme</button>
      </div>
      <span id="dni-status" class="status"></span>
    </div>

    <!-- Estado: documento encontrado -> elegir servicio -->
    <section id="vista-servicio" class="hidden">
      <p id="mensaje-bienvenida" class="bienvenida"></p>

      <div id="servicios-grid" class="servicios-grid">
        <div class="servicio-bloque">
          <h3>Pilates</h3>
          <button type="button" class="btn-servicio" data-area="Pilates" data-servicio="Clase Grupal">Clase Grupal</button>
          <button type="button" class="btn-servicio" data-area="Pilates" data-servicio="Clase Personalizada">Clase Personalizada</button>
          <button type="button" class="btn-servicio" data-area="Pilates" data-servicio="Clase Teens">Clase Teens</button>
          <button type="button" class="btn-servicio" data-area="Pilates" data-servicio="Clase Senior">Clase Senior</button>
        </div>
        <div class="servicio-bloque">
          <h3>Estética</h3>
          <button type="button" class="btn-servicio" data-area="Estética" data-servicio="Consulta Estética">Consulta Estética</button>
          <button type="button" class="btn-servicio" data-area="Estética" data-servicio="Sesión INDIBA">Sesión INDIBA</button>
          <button type="button" class="btn-servicio" data-area="Estética" data-servicio="Sesión Onda Coolwaves">Sesión Onda Coolwaves</button>
          <button type="button" class="btn-servicio" data-area="Estética" data-servicio="Sesión Emerald">Sesión Emerald</button>
        </div>
      </div>

      <div id="otros-panel" class="narrow">
        <label>
          Otros
          <input type="text" id="otros-servicio" autocomplete="off" placeholder="Escribí el servicio y presiona Enter" />
        </label>
      </div>

      <p id="asistencia-message" class="message"></p>

      <div class="form-actions narrow">
        <button type="button" id="btn-editar" class="secondary">Actualizar mis datos</button>
        <button type="button" id="btn-cancelar-asistencia" class="secondary">Cancelar</button>
      </div>
    </section>

    <!-- Estado: completando datos (registro nuevo o edición) -->
    <form id="registro-form" class="hidden" autocomplete="off">
      <label class="full-width">
        Paciente
        <input type="text" id="paciente" name="PACIENTE" required />
      </label>

      <label>
        Tipo Doc
        <select id="tipo-doc" name="TIPO_DOC">
          <option value="DNI">DNI</option>
          <option value="CE">CE</option>
          <option value="RUC">RUC</option>
          <option value="PASAPORTE">PASAPORTE</option>
          <option value="MENOR DE EDAD">MENOR DE EDAD</option>
        </select>
      </label>

      <label>
        Documento
        <input type="text" id="documento-form" name="DOCUMENTO" required />
      </label>

      <label>
        ¿Cómo prefieres que te llamemos?
        <input type="text" id="apodo" name="APODO" />
      </label>

      <label>
        Fecha de Nacimiento
        <input type="date" id="f-nacimiento" name="F_NACIMIENTO" />
      </label>

      <label>
        Sexo
        <select id="sexo" name="SEXO">
          <option value="">Seleccioná</option>
          <option value="Femenino">Femenino</option>
          <option value="Masculino">Masculino</option>
          <option value="Otro">Otro</option>
        </select>
      </label>

      <label>
        Celular
        <input type="tel" id="celular" name="CELULAR" />
      </label>

      <label>
        Distrito
        <select id="distrito" name="DISTRITO">
          <option value="">Seleccioná un distrito</option>
        </select>
      </label>

      <label class="full-width">
        Correo
        <input type="email" id="correo" name="CORREO" />
      </label>

      <label class="full-width">
        Dirección
        <input type="text" id="direccion" name="DIRECCION" />
      </label>

      <div class="form-actions full-width">
        <button type="submit" id="btn-guardar">Guardar</button>
        <button type="button" id="btn-cancelar" class="secondary hidden">Cancelar</button>
      </div>
      <p id="form-message" class="message full-width"></p>
    </form>
  </main>

  <div id="toast" class="toast hidden"></div>

  <script src="documentoValidation.js"></script>
  <script src="app.js"></script>
</body>
</html>
